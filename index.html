<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>MusicApp light</title>
<meta name="theme-color" content="#0A0B0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MusicApp light">
<meta name="musicapp-version" content="1.0.0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>*{--fgr:0px;--fgc:0px}[data-fg=row]>*+*{margin-left:var(--pgc)}[data-fg=col]>*+*{margin-top:var(--pgr)}[data-fg=wrap]>*{margin-right:var(--pgc);margin-bottom:var(--pgr)}

:root{
  --bg: #0A0B0F; --panel: #14161D; --elev: #1B1E28; --elev2: #242835; --line: #262A36;
  --text-primary: #F3F4F6; --text-muted: #A3A8B8; --text-faint: #8A90A3;
  --accent: #FFB648; --accent-soft: rgba(255,182,72,.16); --danger: #EF5350;
  --chord-color: #5AC8FA;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --top: env(safe-area-inset-top, 0px); --bottom: env(safe-area-inset-bottom, 0px);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body{ margin:0; height:100%; background:var(--bg); color:var(--text-primary); font-family:var(--font-ui); font-size:16px; }
body{ overflow:hidden; -webkit-text-size-adjust:100%; }
button, input, select, textarea{ font-family:inherit; font-size:16px; color:inherit; }
button{ -webkit-appearance:none; appearance:none; cursor:pointer; }
[hidden]{ display:none !important; }


.view{ position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg); }
.bar{ position:absolute; left:0; right:0; display:flex; align-items:center; flex-wrap:wrap; padding:8px 10px; background:var(--panel); border-color:var(--line); border-style:solid; border-width:0; }
.bar.top{ top:0; padding-top:calc(8px + var(--top)); border-bottom-width:1px; }
.bar.bottom{ bottom:0; padding-bottom:calc(8px + var(--bottom)); border-top-width:1px; justify-content:center; }
.bar > *{ margin:3px 4px; }
.pane{ position:absolute; left:0; right:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.grow{ -webkit-box-flex:1; -webkit-flex:1 1 auto; flex:1 1 auto; min-width:0; }

.btn{ min-height:44px; padding:0 16px; border-radius:22px; border:1px solid var(--line); background:var(--elev); font-weight:700; white-space:nowrap; }
.btn.accent{ background:var(--accent); border-color:var(--accent); color:#1B1E27; }
.btn.danger{ color:var(--danger); }
.btn.round{ width:44px; padding:0; font-size:20px; }
.btn:active{ background:var(--elev2); }
.btn.accent:active{ background:#E89A2E; }
.logo{ font-weight:800; font-size:18px; }
.logo small{ color:var(--accent); font-weight:700; font-size:13px; margin-left:4px; }
select, input[type=text], input[type=number], input[type=search], textarea{
  min-height:44px; border-radius:10px; border:1px solid var(--line); background:var(--elev); padding:8px 12px; -webkit-appearance:none; appearance:none;
}
select{ padding-right:28px; background-image:linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
  background-position:calc(100% - 16px) 19px, calc(100% - 11px) 19px; background-size:5px 5px; background-repeat:no-repeat; }


#libList{ top:0; bottom:0; padding:8px 10px calc(24px + var(--bottom)); }
.song{ display:flex; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:14px; margin-bottom:8px; padding:6px 6px 6px 12px; }
.song .num{ width:28px; color:var(--text-faint); font-weight:700; font-size:14px; -webkit-flex:0 0 auto; flex:0 0 auto; }
.song .main{ -webkit-flex:1 1 auto; flex:1 1 auto; min-width:0; padding:6px 8px 6px 0; }
.song .t{ font-weight:700; font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.song .a{ color:var(--text-muted); font-size:14px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.song .acts{ -webkit-flex:0 0 auto; flex:0 0 auto; white-space:nowrap; }
.song .acts .btn{ margin-left:4px; width:44px; padding:0; }
.empty{ color:var(--text-muted); text-align:center; padding:40px 20px; line-height:1.5; }


#prScroll{ padding:22px 24px 0; }
#prScroll .song-heading{ font-family:var(--font-ui); margin-bottom:.6em; }
#prScroll .song-heading b{ display:block; font-size:1.05em; }
#prScroll .song-heading span{ color:var(--text-muted); font-size:.7em; }
.step{ display:inline-flex; align-items:center; background:var(--elev); border:1px solid var(--line); border-radius:22px; }
.step span{ font-size:11px; font-weight:800; text-transform:uppercase; color:var(--text-muted); padding:0 4px 0 12px; }
.step b{ min-width:30px; text-align:center; }
.step .btn{ border:0; background:none; width:40px; padding:0; font-size:22px; }
#btnPlay{ width:56px; height:56px; border-radius:28px; font-size:22px; }
#prTitle{ font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#prSub{ color:var(--text-muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#prPos{ color:var(--text-faint); font-size:13px; font-weight:700; }
#pulse{ position:absolute; top:12px; right:14px; width:26px; height:26px; border-radius:13px; background:var(--accent); opacity:0; pointer-events:none; }
#pulse.on{ opacity:1; }
#countIn{ position:absolute; left:0; right:0; top:35%; text-align:center; font-size:120px; font-weight:800; color:var(--accent); pointer-events:none; text-shadow:0 4px 30px rgba(0,0,0,.8); }


#edPane{ top:0; bottom:0; padding:12px 14px 30px; }
.field{ margin-bottom:12px; }
.field label{ display:block; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:6px; }
.field input, .field select{ width:100%; }
.row2{ display:flex; }
.row2 > .field{ -webkit-flex:1 1 0; flex:1 1 0; min-width:0; }
.row2 > .field + .field{ margin-left:10px; }
#edContent{ width:100%; min-height:340px; font-family:var(--font-mono); font-size:15px; line-height:1.5; resize:vertical; }
.hint{ color:var(--text-muted); font-size:13px; line-height:1.45; }


.sheet{ position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(5,6,9,.72); z-index:50; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:20px 12px; }
.sheet .box{ max-width:520px; margin:0 auto; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px; }
.sheet h2{ margin:0 0 12px; font-size:20px; }
.sheet h3{ margin:18px 0 8px; font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); }
.sheet .btn{ margin:0 8px 8px 0; }
.sheet .list .btn{ display:block; width:100%; text-align:left; margin:0 0 8px; }
.sheet .end{ text-align:right; margin-top:10px; }
.sheet select{ width:100%; margin-bottom:8px; }
#toast{ position:fixed; left:50%; bottom:calc(90px + var(--bottom)); width:90%; max-width:480px; margin-left:-45%; background:#262A36; border:1px solid #3A4052; border-radius:14px; padding:12px 16px; z-index:80; box-shadow:0 8px 24px rgba(0,0,0,.5); font-weight:600; }
@media (min-width: 534px){ #toast{ margin-left:-240px; } }


.prompter-content{
  font-family: var(--font-mono);
  font-size: var(--prompter-font-size, 28px);
  line-height: 2.15;
  max-width: 1000px;
  margin:0 auto;
  
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
.prompter-content::after{ content:''; display:block; height:60vh; }
.song-line{ position:relative; }
.lyric-row{ white-space:pre-wrap; overflow-wrap:break-word; color: var(--text-primary); }
.lyric-row .clr{ font-weight:700; }
.w{ white-space:nowrap; }
.ca{ display:inline-block; white-space:pre; vertical-align:baseline; }
.w.long{ white-space:pre-wrap; }
.w.long .ca{ white-space:pre-wrap; overflow-wrap:anywhere; max-width:100%; }
.ca .chords{
  display:flex; gap:.35em;--fgr:.35em;--fgc:.35em; white-space:nowrap;
  line-height:1.15;
  margin-bottom: var(--chord-gap, -.4em);
}
.ca .chord{
  font-weight:800;
  color: var(--chord-color);
  background: rgba(0,0,0,.5);
  padding:0 .12em;
  border-radius:4px;
}
.line-spacer{ height:.85em; }
.chords-only-line{
  display:flex; flex-wrap:wrap; gap:.6em;--fgr:.6em;--fgc:.6em; margin: .5em 0;
}
.chords-only-line .chord{
  font-weight:800; color: var(--chord-color);
  background: rgba(0,0,0,.5); padding:.05em .35em; border-radius:5px;
}
.chord-note{ font-weight:600; color: var(--text-muted); white-space:nowrap; }
.ca .chord-note{ padding:0 .12em; }
.section-label{
  margin: .9em 0 .35em;
  font-weight:800; text-transform:uppercase; letter-spacing:.06em;
  font-size:.62em; color: var(--accent);
  border-left:3px solid var(--accent);
  padding-left:.6em;
  font-family: var(--font-ui);
}
.section-label .clr{ font-weight:800; }
.grid-block{
  --gline:#3A4052; --gline-strong:#5A6178; --gbar: var(--text-primary);
  --gh:2.3em;                                             
  margin:.35em 0 .9em; line-height:1.15;
  border-top:1px solid var(--gline); border-left:1px solid var(--gline);
  break-inside:avoid;
}
.gr{ display:grid; grid-template-columns:repeat(var(--gcols,4), 1fr); break-inside:avoid; }
.gm{
  position:relative; min-height:var(--gh); min-width:0;
  border-right:1px solid var(--gline); border-bottom:1px solid var(--gline);
  display:flex; align-items:center; justify-content:center;
  font-weight:800;
}
.gm .chord{ font-weight:800; color: var(--chord-color); font-size:1.05em; background:none; padding:0; white-space:nowrap; }
.gm .one{ display:flex; flex-direction:column; align-items:center; gap:.12em;--fgr:.12em;--fgc:.12em; }
.gm .gnote{ font-size:max(.46em, 10px); font-family: var(--font-ui); color: var(--text-muted); font-weight:600; white-space:nowrap; }
.gm .gtxt{ font-size:.64em; font-family: var(--font-ui); font-weight:800; letter-spacing:.02em; color: var(--text-muted); white-space:nowrap; }
.gm .simile{ width:1.55em; height:1.03em; color: var(--chord-color); }
.gm.multi .one{ flex-direction:row; flex-wrap:wrap; justify-content:center; align-content:center; gap:0 .5em;--fgr:0;--fgc:.5em; font-size:.76em; padding:.1em .3em; }
.gm.multi .gnote{ flex-basis:100%; text-align:center; }
.gm.split .gdiag{ position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }
.gm.split .gdiag line{ stroke: var(--gline-strong); stroke-width:1.5px; }
.gm .p1{ position:absolute; left:.45em; top:.2em; display:flex; align-items:center; }
.gm .p2{ position:absolute; right:.45em; bottom:.2em; display:flex; align-items:center; }
.gm .p1 .chord, .gm .p2 .chord{ font-size:.92em; }
.gm .p1 .simile, .gm .p2 .simile{ width:1.15em; height:.78em; }
.gm .pn{ position:absolute; left:.4em; bottom:.12em; }
.grid-block{ --gbarw: max(3px, .13em); }
.gm.rs{ box-shadow: inset var(--gbarw) 0 0 var(--gbar); }
.gm.re{ box-shadow: inset calc(-1 * var(--gbarw)) 0 0 var(--gbar); }
.gm.rs.re{ box-shadow: inset var(--gbarw) 0 0 var(--gbar), inset calc(-1 * var(--gbarw)) 0 0 var(--gbar); }
.gm.dbl{ box-shadow: inset calc(-.07em - 1px) 0 0 var(--gbar); }
.gm.fin{ box-shadow: inset calc(-1.5 * var(--gbarw)) 0 0 var(--gbar); }
.gm.rs::before, .gm.re::after{
  content:''; position:absolute; top:50%; width:.5em; height:1.2em; transform:translateY(-50%); pointer-events:none;
  background:
    radial-gradient(circle at 50% 30%, var(--gbar) 0, var(--gbar) .085em, transparent calc(.085em + .5px)),
    radial-gradient(circle at 50% 70%, var(--gbar) 0, var(--gbar) .085em, transparent calc(.085em + .5px));
}
.gm.rs::before{ left:.12em; }
.gm.re::after{ right:.12em; }
.gm.split.rs .p1{ left:.9em; }
.gm.split.re .p2{ right:.9em; }
.gm.multi.rs .one{ padding-left:.9em; }
.gm.multi.re .one{ padding-right:.9em; }
.gm .gv{
  position:absolute; left:0; right:0; top:0; box-sizing:border-box;
  border-top:2px solid var(--gbar); border-left:2px solid var(--gbar);
  padding:.1em 0 0 .45em; height:1.45em;
  font-family: var(--font-ui); font-size:.42em; font-weight:800; line-height:1.2; color: var(--text-muted);
}
.is-grid-view .prompter-content{
  font-size: var(--grid-font-size, 34px);
  max-width:none; width:100%; margin:0;
  line-height:1.15;
}
.is-grid-view .grid-block:last-child{ margin-bottom:0; }
.is-grid-view .prompter-content::after{ display:none; }
.is-grid-view .section-label{ margin-top:.55em; }
.prompter-content .song-line.line-now{
  background: var(--accent-soft-2); border-radius:8px; box-shadow: -10px 0 0 var(--accent-soft-2), 10px 0 0 var(--accent-soft-2);
}
.chord-head{ display:flex; align-items:center; justify-content:space-between; gap:12px;--fgr:12px;--fgc:12px; margin-bottom:4px; }
.chord-head h3{ font-size:30px !important; margin:0 !important; font-family: var(--font-mono); font-weight:800; color: var(--chord-color); }
.chord-reading{ margin-bottom:4px !important; color: var(--accent) !important; font-weight:700; }
.chord-notes{ margin-bottom:12px !important; }
.chord-notes b{ font-family: var(--font-mono); }
.chord-instrument{ margin-bottom:10px; }
.chord-diagram{ display:flex; justify-content:center; margin:6px 0 4px; color: var(--text-primary); min-height:120px; }
.chord-svg{ width:100%; max-width:290px; height:auto; display:block; }
.chord-svg.chord-piano{ max-width:100%; }
.chord-variants{ display:flex; align-items:center; justify-content:center; gap:14px;--fgr:14px;--fgc:14px; margin:6px 0; font-size:13px; font-weight:700; color: var(--text-muted); }
.chord-variants[hidden]{ display:none; }
.chord-variants .chip-btn{ min-width:44px; min-height:40px; font-size:20px; }
.chord-tab{ margin:4px 0 12px !important; text-align:center; white-space:pre; font-family: var(--font-mono); font-size:13px !important; color: var(--text-muted) !important; line-height:1.5 !important; }
.chord-tab:empty{ display:none; }
.chord-song[hidden]{ display:none; }
.chord-chips{ display:flex; flex-wrap:wrap; gap:6px;--fgr:6px;--fgc:6px; }
.chord-chip{
  min-height:36px; padding:0 12px; border-radius: var(--radius-pill); border:1px solid var(--line);
  background: var(--bg-elevated); color: var(--chord-color); font-family: var(--font-mono); font-size:14px; font-weight:800; cursor:pointer;
}
.chord-chip[aria-pressed="true"]{ background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.prompter-content .song-heading{ line-height:1.25; }
@media (max-width: 600px){ #prScroll{ padding:16px 12px 0; } }
</style>
</head>
<body>

<!-- ============ BIBLIOTHÈQUE ============ -->
<section class="view" id="viewLib">
  <div class="bar top" id="libTop">
    <span class="logo">MusicApp<small>light</small></span>
    <select id="libPlaylist" class="grow" aria-label="Liste affichée"></select>
    <button class="btn round" id="fabNew" aria-label="Nouvelle chanson" title="Nouvelle chanson">＋</button>
    <button class="btn round" id="btnPlMenu" aria-label="Playlist : nouvelle, renommer, supprimer" title="Playlists">☰</button>
    <button class="btn round" id="btnSettings" aria-label="Réglages" title="Réglages">⚙︎</button>
    <input type="search" id="libSearch" class="grow" placeholder="Rechercher : titre, artiste…" autocomplete="off" style="width:100%; margin-top:6px;">
  </div>
  <div class="pane" id="libList"></div>
</section>

<!-- ============ PROMPTEUR ============ -->
<section class="view" id="viewPr" hidden>
  <div class="bar top" id="prTop">
    <button class="btn round" id="btnPrBack" aria-label="Retour à la liste">‹</button>
    <div class="grow"><div id="prTitle"></div><div id="prSub"></div></div>
    <span id="prPos"></span>
    <button class="btn round" id="btnPrEdit" aria-label="Modifier la chanson" title="Modifier">✎</button>
    <button class="btn round" id="btnFull" aria-label="Plein écran" title="Plein écran" hidden>⤢</button>
  </div>
  <div class="pane" id="prScroll"><div class="prompter-content" id="prContent"></div></div>
  <div id="pulse"></div>
  <div id="countIn" hidden></div>
  <div class="bar bottom" id="prBottom">
    <span class="step"><span>Vitesse</span><button class="btn" data-step="speed:-1" aria-label="Ralentir">−</button><b id="vSpeed">5</b><button class="btn" data-step="speed:1" aria-label="Accélérer">+</button></span>
    <span class="step"><span>Taille</span><button class="btn" data-step="font:-1" aria-label="Texte plus petit">−</button><b id="vFont">28</b><button class="btn" data-step="font:1" aria-label="Texte plus grand">+</button></span>
    <span class="step"><span>Capo</span><button class="btn" data-step="capo:-1" aria-label="Transposer vers le bas">−</button><b id="vCapo">0</b><button class="btn" data-step="capo:1" aria-label="Transposer vers le haut">+</button></span>
    <button class="btn round" id="btnPrev" aria-label="Chanson précédente">⏮</button>
    <button class="btn accent" id="btnPlay" aria-label="Lecture / pause">▶</button>
    <button class="btn round" id="btnNext" aria-label="Chanson suivante">⏭</button>
  </div>
</section>

<!-- ============ ÉDITEUR ============ -->
<section class="view" id="viewEd" hidden>
  <div class="bar top">
    <button class="btn" id="btnEdCancel">Annuler</button>
    <span class="grow" id="edHead" style="font-weight:800; text-align:center;"></span>
    <button class="btn accent" id="btnEdSave">Enregistrer</button>
  </div>
  <div class="pane" id="edPane">
    <div class="row2">
      <div class="field"><label for="edTitle">Titre</label><input type="text" id="edTitle" autocomplete="off"></div>
      <div class="field"><label for="edArtist">Artiste</label><input type="text" id="edArtist" autocomplete="off"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="edKey">Tonalité</label><input type="text" id="edKey" placeholder="Am, G, Bb…" autocomplete="off" autocapitalize="off"></div>
      <div class="field"><label for="edBpm">Tempo (BPM)</label><input type="number" id="edBpm" inputmode="numeric" min="30" max="300" placeholder="—"></div>
      <div class="field"><label for="edSig">Mesure</label><select id="edSig"></select></div>
    </div>
    <div class="field"><label for="edContent">Paroles et accords</label><textarea id="edContent" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea></div>
    <p class="hint">Accords entre crochets juste avant la syllabe : <b>[Am]</b>Une ligne, ou une ligne d'accords seule au-dessus des paroles. Repère : <b>{c: Refrain}</b>. Couleur : <b>{rouge:texte}</b>.</p>
    <p style="margin-top:20px;"><button class="btn danger" id="btnEdDelete">Supprimer la chanson</button></p>
  </div>
</section>

<!-- ============ FENÊTRES ============ -->
<div class="sheet" id="sheet" hidden><div class="box" id="sheetBox"></div></div>
<div id="toast" hidden></div>
<input type="file" id="importInput" hidden>
